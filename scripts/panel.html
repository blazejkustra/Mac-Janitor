<!doctype html><meta charset=utf-8>
<style>
:root{--wall:url(../site/assets/photos/glacier-2560.jpg)}
html,body{margin:0;background:transparent}
.scene{position:relative;width:440px;height:620px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.glass{position:absolute;overflow:hidden;isolation:isolate}
.glass::before{content:"";position:absolute;z-index:-1;left:calc(-1 * var(--x));top:calc(-1 * var(--y));width:1100px;height:688px;background:var(--wall) 30% 40%/cover;filter:blur(48px) saturate(1.2)}
.bar{--x:0px;--y:0px;left:0;top:0;width:100%;height:26px;display:flex;align-items:center;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 78%,transparent)}
.bar::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(18,19,22,.55);box-shadow:inset 0 -1px rgba(255,255,255,.06)}
.item{position:absolute;top:2px;height:22px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);font-size:13px;font-weight:400;letter-spacing:-.01em}
.glyph{left:40px;width:34px;border-radius:6px;background:rgba(255,255,255,.2)}
.glyph i{width:18px;height:18px;background:#fff;-webkit-mask:url(../assets/menubar.svg) center/contain no-repeat}
.clock{left:300px}
.panel{--x:40px;--y:32px;left:40px;top:32px;width:360px;height:544px;border-radius:22px;box-shadow:0 0 0 .5px rgba(0,0,0,.9),0 24px 60px rgba(0,0,0,.55),0 8px 20px rgba(0,0,0,.35)}
.panel::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:rgba(30,31,34,.84);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px rgba(255,255,255,.08)}
.panel img{display:block;width:360px;height:544px}
</style>
<div class=scene>
  <div class="glass bar"><span class="item glyph"><i></i></span><span class="item clock">Wed 11 Nov&nbsp;&nbsp;9:41</span></div>
  <div class="glass panel"><img id=shot alt=""></div>
</div>
<script>shot.src = new URLSearchParams(location.search).get("panel")</script>
